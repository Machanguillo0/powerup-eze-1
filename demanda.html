<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Personalizar Demanda Nexo Causal</title>
  <!-- Cargamos el estilo estándar de Trello para iframe modal -->
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Noto Sans", "Ubuntu", "Droid Sans", "Helvetica Neue", sans-serif;
      color: #172b4d;
      background-color: #f4f5f7;
    }
    
    #form-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 16px;
      box-sizing: border-box;
    }

    #demanda-form-fields {
      flex: 1;
      overflow-y: auto;
      padding-right: 8px;
      margin-bottom: 12px;
    }
    
    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    label {
      font-weight: 600;
      font-size: 13px;
      color: #5e6c84;
    }
    
    select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ced4da;
      border-radius: 3px;
      background-color: #fff;
      color: #172b4d;
      font-size: 13px;
      cursor: pointer;
    }
    
    select:focus {
      outline: none;
      border-color: #0079bf;
    }

    input[type="text"].demanda-input-field {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ced4da;
      border-radius: 3px;
      background-color: #fff;
      color: #172b4d;
      font-size: 13px;
      box-sizing: border-box;
    }

    input[type="text"].demanda-input-field:focus {
      outline: none;
      border-color: #0079bf;
    }

    .form-group.horizontal {
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
    }

    .form-group.horizontal label {
      margin: 0 !important;
      padding: 0 !important;
      line-height: 24px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .form-group.horizontal input {
      margin: 0 !important;
    }

    input[type="text"].demanda-input-field.narrow {
      margin: 0 !important;
      width: 55px;
      height: 26px;
      padding: 0 4px;
      font-size: 13px;
      text-align: center;
      flex-shrink: 0;
      box-sizing: border-box;
      line-height: 24px;
    }

    input[type="text"].demanda-input-field.narrow-date {
      margin: 0 !important;
      width: 105px;
      height: 26px;
      padding: 0 6px;
      font-size: 13px;
      text-align: center;
      flex-shrink: 0;
      box-sizing: border-box;
      line-height: 24px;
    }
    
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
      background-color: #f4f5f7;
      flex-shrink: 0;
    }
    
    button {
      background-color: #0079bf;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }
    
    button:hover {
      background-color: #026aa7;
    }
    
    button.secondary {
      background-color: #091e420f;
      color: #172b4d;
    }
    
    button.secondary:hover {
      background-color: #091e4224;
    }
    
    .message {
      font-size: 13px;
      color: #5e6c84;
      text-align: center;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <div id="form-container" style="display: none;">
    <div id="demanda-form-fields">
      <!-- Inyectados dinámicamente -->
    </div>
    <div class="actions">
      <button id="btn-cancelar" class="secondary">Cancelar</button>
      <button id="btn-generar">Generar demanda</button>
    </div>
  </div>

  <div id="no-data-message" class="message">
    Esperando datos de la plantilla...
  </div>

  <!-- Cargamos el script oficial de Trello Power-Up -->
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script>
    var t = window.TrelloPowerUp.iframe();
    var bc = new BroadcastChannel('demanda_channel');
    var receivedData = null;    // Pedir datos a section.html con reintento automático hasta recibir respuesta
    function requestMetaTags() {
      if (!receivedData) {
        bc.postMessage({ type: 'get_meta_tags' });
      }
    }
    requestMetaTags();
    var metaInterval = setInterval(function() {
      if (receivedData) {
        clearInterval(metaInterval);
      } else {
        requestMetaTags();
      }
    }, 250);

    // Escuchar respuesta
    bc.onmessage = function(event) {
      if (event.data && event.data.type === 'meta_tags') {
        if (!event.data.metaTags) return; // Si aún no están listas, esperar siguiente reintento
        receivedData = event.data.metaTags;
        clearInterval(metaInterval);
        
        // Obtener el idList de la tarjeta actual para cargar la persistencia a nivel de cliente (columna)
        t.card('idList')
          .then(function(card) {
            var idList = card ? card.idList : null;
            var storageKey = idList ? ('demanda_selections_' + idList) : null;
            return storageKey ? t.get('board', 'shared', storageKey) : Promise.resolve({});
          })
          .then(function(saved) {
            renderForm(receivedData, saved || {});
          })
          .catch(function(e) {
            console.error("Error al recuperar persistencia de demanda:", e);
            renderForm(receivedData, {});
          });
      }
    };

    t.render(function() {
      if (receivedData) {
        resizeModal();
      }
    });

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderForm(metaTags, saved) {
      var fieldsContainer = document.getElementById('demanda-form-fields');
      fieldsContainer.innerHTML = '';

      var hasFields = false;
      for (var title in metaTags) {
        hasFields = true;
        var metaTag = metaTags[title];
        if (!metaTag) continue;

        var formGroup = document.createElement('div');
        formGroup.className = 'form-group';

        var label = document.createElement('label');
        label.className = 'demanda-label';
        label.textContent = metaTag.title || title;
        formGroup.appendChild(label);

        if (metaTag.type === 'select') {
          formGroup.className = 'form-group horizontal';
          label.style.display = 'inline-block';
          label.style.marginBottom = '0px';

          var select = document.createElement('select');
          select.className = 'demanda-select';
          select.setAttribute('data-title', title);
          select.style.width = 'auto';
          select.style.minWidth = '180px';
          select.style.flex = '1';
          select.style.maxWidth = '100%';

          (metaTag.options || []).forEach(function(opt, index) {
            var option = document.createElement('option');
            option.value = opt.value || '';
            option.textContent = opt.name || opt.value || ('Opción ' + (index + 1));
            select.appendChild(option);
          });

          if (saved && saved[title] !== undefined) {
            select.value = saved[title];
          }

          formGroup.appendChild(select);
        } else if (metaTag.type === 'checkbox') {
          var checkboxContainer = document.createElement('div');
          checkboxContainer.className = 'checkbox-group-container';

          (metaTag.options || []).forEach(function(opt, index) {
            var itemLabel = document.createElement('label');
            itemLabel.className = 'demanda-checkbox-label';

            var checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'demanda-checkbox-option';
            checkbox.setAttribute('data-title', title);
            checkbox.setAttribute('data-index', index);

            var span = document.createElement('span');
            span.textContent = opt.name || opt.value || ('Opción ' + (index + 1));

            if (saved && saved[title] && Array.isArray(saved[title])) {
              if (saved[title].indexOf(index) > -1) {
                checkbox.checked = true;
              }
            }

            itemLabel.appendChild(checkbox);
            itemLabel.appendChild(span);
            checkboxContainer.appendChild(itemLabel);
          });
          formGroup.appendChild(checkboxContainer);
        } else if (metaTag.type === 'single-checkbox') {
          formGroup.className = 'form-group horizontal';
          label.style.display = 'inline-block';
          label.style.marginBottom = '0px';

          var itemLabel = document.createElement('label');
          itemLabel.style.display = 'inline-flex';
          itemLabel.style.alignItems = 'center';
          itemLabel.style.margin = '0';
          itemLabel.style.padding = '0';
          itemLabel.style.cursor = 'pointer';

          var checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'demanda-checkbox-option';
          checkbox.setAttribute('data-title', title);
          checkbox.setAttribute('data-index', 0);
          checkbox.style.cursor = 'pointer';
          checkbox.style.width = '16px';
          checkbox.style.height = '16px';
          checkbox.style.margin = '0';

          var span = document.createElement('span');
          span.style.display = 'inline-block';
          span.style.width = '16px';
          span.style.height = '16px';
          span.style.margin = '0';

          if (saved && saved[title] && Array.isArray(saved[title])) {
            if (saved[title].indexOf(0) > -1) {
              checkbox.checked = true;
            }
          }

          itemLabel.appendChild(checkbox);
          itemLabel.appendChild(span);
          formGroup.appendChild(itemLabel);
        } else if (metaTag.type === 'int' || metaTag.type === 'number' || metaTag.type === 'float') {
          formGroup.className = 'form-group horizontal';
          label.style.display = 'inline-block';
          label.style.marginBottom = '0px';

          var input = document.createElement('input');
          input.type = 'text';
          input.className = 'demanda-input-field narrow';
          input.setAttribute('data-title', title);
          input.setAttribute('data-type', metaTag.type);
          
          if (saved && saved[title] !== undefined) {
            input.value = saved[title];
          }

          formGroup.appendChild(input);
        } else if (metaTag.type === 'date-range') {
          formGroup.className = 'form-group horizontal';
          label.style.display = 'inline-block';
          label.style.marginBottom = '0px';

          var dateContainer = document.createElement('div');
          dateContainer.style.display = 'flex';
          dateContainer.style.alignItems = 'center';
          dateContainer.style.gap = '6px';

          var spanDesde = document.createElement('span');
          spanDesde.textContent = 'Desde:';
          spanDesde.style.fontSize = '12px';
          spanDesde.style.color = '#5e6c84';

          var inputDesde = document.createElement('input');
          inputDesde.type = 'text';
          inputDesde.className = 'demanda-input-field narrow-date demanda-date-input-desde';
          inputDesde.setAttribute('data-title', title);
          inputDesde.placeholder = 'DD/MM/AAAA';
          inputDesde.maxLength = 10;

          var spanHasta = document.createElement('span');
          spanHasta.textContent = 'Hasta:';
          spanHasta.style.fontSize = '12px';
          spanHasta.style.color = '#5e6c84';

          var inputHasta = document.createElement('input');
          inputHasta.type = 'text';
          inputHasta.className = 'demanda-input-field narrow-date demanda-date-input-hasta';
          inputHasta.setAttribute('data-title', title);
          inputHasta.placeholder = 'DD/MM/AAAA';
          inputHasta.maxLength = 10;

          var applyAutoFormat = function(inp) {
            inp.addEventListener('input', function(e) {
              var val = inp.value.replace(/\D/g, '');
              if (val.length >= 5) {
                inp.value = val.substring(0,2) + '/' + val.substring(2,4) + '/' + val.substring(4,8);
              } else if (val.length >= 3) {
                inp.value = val.substring(0,2) + '/' + val.substring(2);
              } else {
                inp.value = val;
              }
            });
          };
          applyAutoFormat(inputDesde);
          applyAutoFormat(inputHasta);

          if (saved && saved[title]) {
            if (typeof saved[title] === 'object') {
              if (saved[title].desde) inputDesde.value = saved[title].desde;
              if (saved[title].hasta) inputHasta.value = saved[title].hasta;
            }
          }

          dateContainer.appendChild(spanDesde);
          dateContainer.appendChild(inputDesde);
          dateContainer.appendChild(spanHasta);
          dateContainer.appendChild(inputHasta);
          formGroup.appendChild(dateContainer);
        } else if (metaTag.type === 'date') {
          formGroup.className = 'form-group horizontal';
          label.style.display = 'inline-block';
          label.style.marginBottom = '0px';

          var inputDate = document.createElement('input');
          inputDate.type = 'text';
          inputDate.className = 'demanda-input-field narrow-date';
          inputDate.setAttribute('data-title', title);
          inputDate.setAttribute('data-type', 'date');
          inputDate.placeholder = 'DD/MM/AAAA';
          inputDate.maxLength = 10;

          inputDate.addEventListener('input', function(e) {
            var val = inputDate.value.replace(/\D/g, '');
            if (val.length >= 5) {
              inputDate.value = val.substring(0,2) + '/' + val.substring(2,4) + '/' + val.substring(4,8);
            } else if (val.length >= 3) {
              inputDate.value = val.substring(0,2) + '/' + val.substring(2);
            } else {
              inputDate.value = val;
            }
          });

          if (saved && saved[title] !== undefined) {
            inputDate.value = saved[title];
          }

          formGroup.appendChild(inputDate);
        } else {
          var inputTxt = document.createElement('input');
          inputTxt.type = 'text';
          inputTxt.className = 'demanda-input-field';
          inputTxt.setAttribute('data-title', title);

          if (saved && saved[title] !== undefined) {
            inputTxt.value = saved[title];
          }

          formGroup.appendChild(inputTxt);
        }

        fieldsContainer.appendChild(formGroup);
      }

      if (hasFields) {
        document.getElementById('no-data-message').style.display = 'none';
        document.getElementById('form-container').style.display = 'flex';
        document.getElementById('btn-generar').style.display = 'inline-block';
        resizeModal();
      } else {
        document.getElementById('no-data-message').textContent = 'No se encontraron meta-etiquetas de personalización en la plantilla.';
        document.getElementById('no-data-message').style.display = 'block';
        document.getElementById('form-container').style.display = 'none';
        t.sizeTo(document.body).catch(function(e){});
      }
    }



    document.getElementById('btn-generar').addEventListener('click', function() {
      try {
        var selections = {};
        var rawSelections = {};
        var formState = {};
        
        // 1. Recopilar valores de dropdowns
        var selects = document.querySelectorAll('.demanda-select');
        selects.forEach(function(s) {
          var title = s.getAttribute('data-title');
          if (!title) return;
          selections[title] = s.value;
          var selectedOptName = (s.selectedIndex >= 0 && s.options && s.options[s.selectedIndex]) ? s.options[s.selectedIndex].text : s.value;
          rawSelections[title] = [selectedOptName];
          formState[title] = s.value;
        });

        // 1.2. Recopilar valores de campos de texto
        var inputs = document.querySelectorAll('.demanda-input-field');
        inputs.forEach(function(inp) {
          var title = inp.getAttribute('data-title');
          if (!title) return;
          var val = inp.value.trim();
          var type = inp.getAttribute('data-type');
          
          formState[title] = val;
          
          if (type === 'date' && val) {
            var formattedVal = formatSpanishLongDate(val);
            selections[title] = formattedVal;
            rawSelections[title] = [formattedVal];
          } else {
            selections[title] = val;
            rawSelections[title] = [val];
          }
        });

        // 1.3. Recopilar valores de campos de tipo date-range
        var dateRangeGroups = {};
        var inputsDesde = document.querySelectorAll('.demanda-date-input-desde');
        inputsDesde.forEach(function(inp) {
          var title = inp.getAttribute('data-title');
          if (title) {
            if (!dateRangeGroups[title]) dateRangeGroups[title] = {};
            dateRangeGroups[title].desde = inp.value.trim();
          }
        });
        var inputsHasta = document.querySelectorAll('.demanda-date-input-hasta');
        inputsHasta.forEach(function(inp) {
          var title = inp.getAttribute('data-title');
          if (title) {
            if (!dateRangeGroups[title]) dateRangeGroups[title] = {};
            dateRangeGroups[title].hasta = inp.value.trim();
          }
        });

        for (var title in dateRangeGroups) {
          var group = dateRangeGroups[title];
          var desdeVal = group.desde;
          var hastaVal = group.hasta;

          var numDaysStr = '';
          if (desdeVal && hastaVal) {
            var dateDesde = parseSpanishDate(desdeVal);
            var dateHasta = parseSpanishDate(hastaVal);
            if (dateDesde && dateHasta) {
              var diffTime = dateHasta.getTime() - dateDesde.getTime();
              var diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;
              if (diffDays >= 0) {
                numDaysStr = String(diffDays);
              } else {
                numDaysStr = '0';
              }
            }
          }
          selections[title] = numDaysStr;
          selections[title + ": start"] = desdeVal || '';
          selections[title + ":start"] = desdeVal || '';
          selections[title + ": end"] = hastaVal || '';
          selections[title + ":end"] = hastaVal || '';

          var desdeText = desdeVal ? formatSpanishLongDate(desdeVal) : '';
          var hastaText = hastaVal ? formatSpanishLongDate(hastaVal) : '';

          selections[title + ":start-text"] = desdeText;
          selections[title + ": start-text"] = desdeText;
          selections[title + ":end-text"] = hastaText;
          selections[title + ": end-text"] = hastaText;
          
          selections[title + ":start - text"] = desdeText;
          selections[title + ": start - text"] = desdeText;
          selections[title + ":end - text"] = hastaText;
          selections[title + ": end - text"] = hastaText;
          
          selections[title + ":start[text]"] = desdeText;
          selections[title + ": start[text]"] = desdeText;
          selections[title + ":end[text]"] = hastaText;
          selections[title + ": end[text]"] = hastaText;

          selections[title + ":start-texto"] = desdeText;
          selections[title + ": start-texto"] = desdeText;
          selections[title + ":end-texto"] = hastaText;
          selections[title + ": end-texto"] = hastaText;

          rawSelections[title] = [numDaysStr];
          rawSelections[title + ": start"] = [desdeVal || ''];
          rawSelections[title + ":start"] = [desdeVal || ''];
          rawSelections[title + ": end"] = [hastaVal || ''];
          rawSelections[title + ":end"] = [hastaVal || ''];

          rawSelections[title + ":start-text"] = [desdeText];
          rawSelections[title + ": start-text"] = [desdeText];
          rawSelections[title + ":end-text"] = [hastaText];
          rawSelections[title + ": end-text"] = [hastaText];
          
          rawSelections[title + ":start - text"] = [desdeText];
          rawSelections[title + ": start - text"] = [desdeText];
          rawSelections[title + ":end - text"] = [hastaText];
          rawSelections[title + ": end - text"] = [hastaText];
          
          rawSelections[title + ":start[text]"] = [desdeText];
          rawSelections[title + ": start[text]"] = [desdeText];
          rawSelections[title + ":end[text]"] = [hastaText];
          rawSelections[title + ": end[text]"] = [hastaText];

          rawSelections[title + ":start-texto"] = [desdeText];
          rawSelections[title + ": start-texto"] = [desdeText];
          rawSelections[title + ":end-texto"] = [hastaText];
          rawSelections[title + ": end-texto"] = [hastaText];

          formState[title] = { desde: desdeVal, hasta: hastaVal };
        }

        // 2. Recopilar valores de checkboxes agrupados por título sin usar selector de atributos peligroso
        var allCheckboxGroups = Array.from(document.querySelectorAll('.demanda-checkbox-option'));
        var titles = [];
        allCheckboxGroups.forEach(function(cb) {
          var title = cb.getAttribute('data-title');
          if (title && titles.indexOf(title) === -1) {
            titles.push(title);
          }
        });
        var nextAutoNum = 2;

        titles.forEach(function(title) {
          var checkedBoxes = allCheckboxGroups.filter(function(cb) {
            return cb.getAttribute('data-title') === title && cb.checked;
          });
          
          rawSelections[title] = [];
          var metaInfo = (receivedData && receivedData[title]) ? receivedData[title] : null;
          var originalOptions = metaInfo ? (metaInfo.options || []) : [];

          checkedBoxes.forEach(function(cb) {
            var index = parseInt(cb.getAttribute('data-index'), 10);
            var opt = originalOptions[index];
            if (opt && opt.name) {
              rawSelections[title].push(opt.name);
            }
          });

          if (checkedBoxes.length === 0) {
            selections[title] = '';
            return;
          }

          var startNum = metaInfo ? metaInfo.startNum : null;
          var autowrap = metaInfo ? (metaInfo.autowrap || false) : false;
          
          if (startNum !== null && startNum !== undefined) {
            nextAutoNum = startNum;
          }

          var selectedIndices = [];
          checkedBoxes.forEach(function(cb) {
            selectedIndices.push(parseInt(cb.getAttribute('data-index'), 10));
          });
          selectedIndices.sort(function(a, b) { return a - b; });

          var resultText = '';
          var selectedValues = [];
          selectedIndices.forEach(function(idx) {
            var opt = originalOptions[idx];
            if (opt) {
              selectedValues.push({
                value: opt.value || '',
                separator: opt.separator || ''
              });
            }
          });

          if (autowrap) {
            if (selectedValues.length === 1) {
              resultText = selectedValues[0].value;
            } else if (selectedValues.length > 1) {
              var allButLast = [];
              for (var i = 0; i < selectedValues.length - 1; i++) {
                allButLast.push(selectedValues[i].value);
              }
              var firstPart = allButLast.join(', ');
              var lastValue = selectedValues[selectedValues.length - 1].value;
              resultText = firstPart + ' y ' + lastValue;
            }
          } else {
            selectedValues.forEach(function(item, i) {
              resultText += item.value;
              if (i < selectedValues.length - 1) {
                resultText += item.separator;
              }
            });
          }

          selections[title] = resultText;
        });

        selections["[num]"] = String(nextAutoNum);
        selections["num"] = String(nextAutoNum);
        rawSelections["[num]"] = [String(nextAutoNum)];
        rawSelections["num"] = [String(nextAutoNum)];

        allCheckboxGroups.forEach(function(cb) {
          var title = cb.getAttribute('data-title');
          var index = parseInt(cb.getAttribute('data-index'), 10);
          if (title && cb.checked) {
            if (!formState[title]) {
              formState[title] = [];
            }
            formState[title].push(index);
          }
        });

        console.log("[DEMANDA MODAL DEBUG] Botón Generar pulsado. Enviando mensaje 'generate' a BroadcastChannel...", { selections: selections, rawSelections: rawSelections });
        bc.postMessage({
          type: 'generate',
          selections: selections,
          rawSelections: rawSelections,
          formState: formState
        });

        setTimeout(function() {
          console.log("[DEMANDA MODAL DEBUG] Cerrando modal...");
          t.closeModal();
        }, 100);
      } catch (err) {
        console.error("Error en demanda.html al generar:", err);
        alert("Error al procesar el formulario de demanda: " + err.message);
      }
    });

    document.getElementById('btn-cancelar').addEventListener('click', function() {
      bc.postMessage({ type: 'cancel' });
      t.closeModal();
    });

    // Timeout por si no responde section.html
    setTimeout(function() {
      if (!receivedData) {
        document.getElementById('no-data-message').textContent = 'Por favor, selecciona primero un archivo de Word desde el botón "Generar demanda Nexo causal" en la tarjeta.';
        t.sizeTo(document.body).catch(function(e){});
      }
    }, 1500);

    function parseSpanishDate(str) {
      if (!str) return null;
      var match = str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (!match) return null;
      var day = parseInt(match[1], 10);
      var month = parseInt(match[2], 10) - 1; // 0-indexed en JS
      var year = parseInt(match[3], 10);
      
      var date = new Date(year, month, day);
      if (date.getFullYear() !== year || date.getMonth() !== month || date.getDate() !== day) {
        return null;
      }
      return date;
    }

    function formatSpanishLongDate(str) {
      if (!str) return '';
      var dateObj = parseSpanishDate(str);
      if (!dateObj) return str;
      
      var day = dateObj.getDate();
      var monthNames = [
        "enero", "febrero", "marzo", "abril", "mayo", "junio",
        "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"
      ];
      var month = monthNames[dateObj.getMonth()];
      var year = dateObj.getFullYear();
      
      return day + " de " + month + " de " + year;
    }

    function resizeModal() {
      var fieldsEl = document.getElementById('demanda-form-fields');
      var actionsEl = document.querySelector('.actions');
      var container = document.getElementById('form-container');
      if (!fieldsEl || !actionsEl || !container) return;

      // Restablecer temporalmente para medir la altura natural del contenido
      container.style.height = 'auto';
      document.body.style.height = 'auto';
      document.documentElement.style.height = 'auto';

      var naturalHeight = fieldsEl.scrollHeight + actionsEl.offsetHeight + 44; 
      var targetHeight = Math.min(naturalHeight, 680); 

      // Aplicar altura objetivo para la medición de Trello
      container.style.height = targetHeight + 'px';
      document.body.style.height = targetHeight + 'px';
      document.documentElement.style.height = targetHeight + 'px';

      t.sizeTo(document.body).catch(function(e){});

      // Restaurar restricciones de flexbox inmediatamente para el ajuste si Trello limita el tamaño
      container.style.height = '100%';
      document.body.style.height = '100%';
      document.documentElement.style.height = '100%';
    }
  </script>
</body>
</html>
